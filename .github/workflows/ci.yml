name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    env:
      # Fake env vars for tests (all tests mock DB/external services)
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: garmin_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      API_KEY: fake-api-key-for-ci
      GARMIN_TOKEN_KEY: "dGVzdC1mZXJuZXQta2V5LWZvci1jaS0xMjM0NTY3OA=="
      LOG_LEVEL: WARNING
      CONFIG_PATH: config/config.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check src/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/

      - name: Import check
        run: uv run python -c "from src.api.main import app; print('Import OK')"

      - name: Run tests
        run: uv run pytest tests/ -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Fake env vars for build + tests (no real DB/API needed)
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      GARMIN_API_URL: "https://fake.example.com"
      GARMIN_API_KEY: "fake-key-for-ci"
      BETTER_AUTH_SECRET: "fake-secret-for-ci-build-only-32chars!"
      NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
