name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check src/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/

      - name: Import check
        run: uv run python -c "from src.api.main import app; print('Import OK')"

      - name: Run tests
        run: uv run pytest tests/ -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (includes typecheck)
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          GARMIN_API_URL: "https://fake.example.com"
          GARMIN_API_KEY: "fake-key"
          BETTER_AUTH_SECRET: "fake-secret-for-ci-build-only"
          NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"

      - name: Run tests
        run: pnpm test
