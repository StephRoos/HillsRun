services:
  postgres-replica:
    image: postgres:16-alpine
    container_name: hillsrun-replica
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garmin_connect}
      POSTGRES_USER: ${POSTGRES_USER:-garmin}
      POSTGRES_PASSWORD: ${REPLICA_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin_connect"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
