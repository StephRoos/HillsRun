services:
  postgres-replica:
    image: postgres:16-alpine
    container_name: hillsrun-replica
    environment:
      POSTGRES_DB: garmin_connect
      POSTGRES_USER: garmin
      POSTGRES_PASSWORD: ${REPLICA_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin_connect"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
