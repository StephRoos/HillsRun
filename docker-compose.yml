services:
  postgres:
    image: postgres:15-alpine
    container_name: garmin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garmin_connect}
      POSTGRES_USER: ${POSTGRES_USER:-garmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garmin} -d ${POSTGRES_DB:-garmin_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - garmin-network

  garmin-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin-sync
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-garmin_connect}
      POSTGRES_USER: ${POSTGRES_USER:-garmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GARMIN_TOKENS_DIR: /tokens
      CONFIG_PATH: /app/config/config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Mount Garmin tokens from host (read-only for security)
      - ${GARMIN_TOKENS_DIR:-~/.garminconnect}:/tokens:ro
      # Mount config
      - ./config:/app/config:ro
      # Mount logs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garmin-network
    profiles:
      - sync  # Only start when explicitly called with --profile sync

  garmin-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: garmin-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-garmin_connect}
      POSTGRES_USER: ${POSTGRES_USER:-garmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - garmin-network

volumes:
  postgres_data:
    driver: local

networks:
  garmin-network:
    driver: bridge
