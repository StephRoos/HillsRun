services:
  garmin-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin-sync
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-garmin_connect}
      POSTGRES_USER: ${POSTGRES_USER:-garmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      GARMIN_TOKENS_DIR: /tokens
      GARMIN_TOKEN_KEY: ${GARMIN_TOKEN_KEY}
      CONFIG_PATH: /app/config/config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${GARMIN_TOKENS_DIR:-~/.garminconnect}:/tokens:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - garmin-network
    profiles:
      - sync

  garmin-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: garmin-api
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-garmin_connect}
      POSTGRES_USER: ${POSTGRES_USER:-garmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      GARMIN_TOKENS_DIR: /tokens
      GARMIN_TOKEN_KEY: ${GARMIN_TOKEN_KEY}
      CONFIG_PATH: /app/config/config.yaml
      API_KEY: ${API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${GARMIN_TOKENS_DIR:-~/.garminconnect}:/tokens:ro
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - garmin-network


networks:
  garmin-network:
    driver: bridge
