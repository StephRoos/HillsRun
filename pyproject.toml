[project]
name = "garmin-connect-sync"
version = "0.1.0"
description = "Automatic synchronization of Garmin Connect data to PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.2.19",
    "asyncpg>=0.29.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
