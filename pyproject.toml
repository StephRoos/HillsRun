[project]
name = "garmin-connect-sync"
version = "0.1.0"
description = "Automatic synchronization of Garmin Connect data to PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.2.19",
    "asyncpg>=0.29.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.27.0",
    "garth>=0.4.46",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.22",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
]
